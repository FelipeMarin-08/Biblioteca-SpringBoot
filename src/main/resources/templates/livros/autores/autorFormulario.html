<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Autor</title>
</head>
<body>

<h1 th:text="${indice == null ? 'Cadastro de Autor' : 'Editar Autor'}"></h1>

<form th:action="${indice == null} ?
      @{/livros/autores} :
      @{/livros/autores/atualizar/{indice}(indice=${indice})}"
      th:object="${autor}" method="post">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" th:field="*{nome}" required>
    <br>
    <br>

    <label for="nacionalidade">Nacionalidade:</label>
    <input type="text" id="nacionalidade" th:field="*{nacionalidade}" required>
    <br>
    <br>

    <button type="submit"
            th:text="${indice == null ? 'Cadastrar' : 'Atualizar'}">
    </button>

</form>

</body>
</html>
