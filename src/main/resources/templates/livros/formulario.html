<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Livros</title>
</head>
<body>

<h1 th:text="${livro.id == null ? 'Formulário de Livros' : 'Editar Livro'}"></h1>

<form th:action="${livro.id == null} ?
      @{/livros} :
      @{/livros/atualizar/{id}(id=${livro.id})}"
      th:object="${livro}" method="post">

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" th:field="*{titulo}" required>
    <br>
    <br>

    <label for="autor">Autor:</label>
    <input type="text" id="autor" th:field="*{autor}" required>
    <br>
    <br>

    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn" th:field="*{isbn}" required>
    <br>
    <br>

    <button type="submit"
            th:text="${livro.id == null ? 'Cadastrar' : 'Atualizar'}">
    </button>

</form>

</body>
</html>
