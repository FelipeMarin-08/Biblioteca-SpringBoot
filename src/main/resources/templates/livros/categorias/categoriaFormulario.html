<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Categoria</title>
</head>
<body>

<h1 th:text="${indice == null ? 'Formulário de Categoria' : 'Editar Categoria'}"></h1>

<form th:action="${indice == null} ?
      @{/livros/categorias} :
      @{/livros/categorias/atualizar/{indice}(indice=${indice})}"
      th:object="${categoria}" method="post">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" th:field="*{nome}" required>

    <br>
    <br>

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required>

    <br>
    <br>

    <button type="submit"
            th:text="${indice == null ? 'Cadastrar' : 'Atualizar'}">
    </button>

</form>

</body>
</html>
